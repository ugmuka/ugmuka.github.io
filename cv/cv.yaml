# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
# 経歴書の定義。`make cv` で cv/rendercv_output/ に PDF を生成する。
# 書式: https://docs.rendercv.com/user_guide/yaml_input_structure/cv/
cv:
  name: 向井雄二
  headline: Data Engineer
  email: ugmuka1@gmail.com
  social_networks:
    - network: X
      username: ugmuka
    - network: LinkedIn
      username: muka1206
  custom_connections:
    - fontawesome_icon: pen-nib
      placeholder: Qiita
      url: https://qiita.com/ugmuka
    - fontawesome_icon: book
      placeholder: Zenn
      url: https://zenn.dev/ugmuka
    - fontawesome_icon: speaker-deck
      placeholder: SpeakerDeck
      url: https://speakerdeck.com/ugmuka
  sections:
    職務経歴:
      - company: DATUM STUDIO（株）
        position: データエンジニア
        start_date: 2020-04-01
        end_date: present
        summary: データ分析基盤の設計・構築・移行を中心に、以下のプロジェクトを担当。

    # 新しい順に並べる
    プロジェクト:
      - name: 大手小売業界分析基盤の移行刷新
        start_date: 2025-08
        end_date: present
        location: 役割：Snowflake基盤担当チームリード / チーム8名
        summary: >-
          並列して2システムのリプレースを行いました。
          大手小売業界向けの分析基盤移行刷新プロジェクトにおいて、 Snowflake基盤の要件定義から設計、コーディング、テストを統括しました。
          エンジニア8名のSnowflake基盤担当チームをリードし、 プロジェクト全体では他領域を含む合計約30名規模のチームで構成されていました。
          チームはウォーターフォール開発手法に則り、各フェーズを厳格に管理しながら開発を進めました。
      - name: 自動車センサーデータ集積基盤の移行刷新
        start_date: 2025-01
        end_date: 2026-03
        location: 役割：プロジェクトマネージャー（社内PM） / チーム5名
        summary: >-
          オンプレミスのNASおよびSQL Server廃止に伴う車載器センサー分析システムの AWSとSnowflakeへのクラウド移行を推進しました。
          移行チーム3名およびAPI開発2名、計5名の小規模チームの中で社内PMを務め、 全体で約20名規模の複数チームが協働する体制内でリードとしての役割を果たしました。
      - name: 決算業務に用いる経理BIの移行刷新
        start_date: 2024-07
        end_date: 2024-12
        location: 役割：Snowflake基盤担当チームリード / チーム4名
        summary: >-
          SAP HANA の EOS に伴い、経理部門が決算業務に利用する BI 基盤を Snowflake へ移行した。
      - name: 不動産事業における事業間横断顧客分析基盤の構築
        start_date: 2024-05
        end_date: 2025-03
        location: 役割：Snowflake基盤担当チームリード / チーム4名
        summary: >-
          不動産ホールディングス傘下の複数企業からデータを集約し、サービス横断で顧客を分析する基盤を新規構築した。
      - name: ECサイトの全社向け顧客分析基盤の移行刷新
        start_date: 2023-04
        end_date: 2024-12
        location: 役割：Snowflake基盤担当チームリード / チーム85名
        summary: >-
          ECサイト向けの大規模データ基盤を構築。
          Oracleでの分析基盤からSnowflakeへの移行を行なっている。
      - name: テレビ局向け広告配信用基盤構築
        start_date: 2022-08
        end_date: 2023-04
        location: 役割：データエンジニア
        summary: >-
          クライアントの広告配信事業における広告配信用の顧客データ基盤を構築した。
          プロパーとして、前後システムのベンダーと共に要件定義や開発作業の牽引を行った。
        highlights:
          - >-
            **担当**:
            Snowflakeを用いたデータ基盤のインフラ設計、および構築 /
            テーブル設計 /
            上記インフラのTerraformでのIaC化 /
            要件定義全般
          - >-
            **成果**:
            複数ベンダーとの協業であったため、IFなどの要件定義やテスト仕様の調整に注力した。
            開発フェーズにおいてはレビューを主に行い、社内での人材育成に貢献した。
          - '**技術**: Snowflake, Terraform'
      - name: 動画プラットフォームにおける視聴ログ分析基盤の構築
        start_date: 2021-01
        end_date: 2022-07
        location: 役割：データエンジニア
        summary: >-
          動画プラットフォームにおいて、視聴ログなどを一括管理するデータ分析基盤の構築を支援。
          また、視聴ログ分析から動画の改善を提案するため、KPIダッシュボードを構築した。
        highlights:
          - >-
            **担当**:
            SFTPサーバー上でのデータレイク構築 /
            Python /
            BigQueryを用いたDWH構築(テーブル設計, 運用, SQLでのETL構築) /
            データマート設計
          - >-
            **成果**:
            バック、フロントチームと協業しながら要件を満たすテーブル設計を行う。
          - '**技術**: SFTP, Python, BigQuery'
      - name: スポーツクラブ向けの顧客分析基盤の構築
        start_date: 2020-04
        end_date: 2020-12
        location: 役割：データエンジニア
        summary: >-
          スポーツクラブ向けの顧客データ分析基盤を構築した。
          エクセルベースでの分析からTableauでの分析、定常KPIを表示するダッシュボードへと移行。
        highlights:
          - >-
            **担当**:
            AWS S3上でのデータレイク構築 /
            AWS Glue(Spark)を用いた大規模データの分散処理 /
            Snowflakeを用いたDWH構築(テーブル設計, 運用, SQLでのETL構築) /
            上記インフラのTerraformでのIaC化 /
            GitHub ActionsでのCI/CDの構築 /
            Tableauで表示するためのデータマート設計
          - >-
            **成果**:
            日本でまだ導入事例が少ないDWHであるSnowflakeについて技術検証、導入を行い、分析基盤の大幅な高速化に貢献。
            導入事例をユーザー会で紹介する等、外部への発信も積極的に行った。
          - '**技術**: AWS S3, AWS Glue, Spark, Snowflake, Terraform, GitHub Actions, Tableau'
    スキル:
      - label: Language
        details: Python, SQL, PHP, TypeScript
      - label: Application Framework
        details: Laravel, React
      - label: Cloud
        details: AWS, GCP, Snowflake
      - label: Infrastructure Tools
        details: Terraform
      - label: Data Engineering Tools
        details: dbt(core/cloud), Airflow, Spark
      - label: BI Tools
        details: Looker, PowerBI
      - label: Others
        details: GitHub Actions
    資格:
      - bullet: 応用情報技術者
      - bullet: AWS Solution Architect Professional
      - bullet: AWS Data Analytics Specialty
      - bullet: GCP Professional Data Engineer
      - bullet: SnowPro Advanced Architect
    登壇:
      - name: rawSQLからdbtへの移行プロセスについて
        date: 2022-08-23
        summary: dbt Tokyo meetup — [Slides](https://speakerdeck.com/ugmuka/rawsqlkaradbthefalseyi-xing-purosesunituite)
      - name: 1年間dbtで戦った話
        date: 2022-12-14
        summary: ちゅらコラボ — [Slides](https://speakerdeck.com/ugmuka/14-tiyurakorabodeng-tan-zi-liao)
      - name: Snowparkを基礎からおさらい
        date: 2023-01-26
        summary: Data Engineer Geeks — [Slides](https://speakerdeck.com/ugmuka/snowparkwoji-chu-karaosarai)
      - name: Snowflakeでやらかした時の対処法
        date: 2023-05-28
        summary: Snowflakeの小技LT〜ChatGPTも知らない？秘密のテクニック教えて！〜 — [Slides](https://speakerdeck.com/ugmuka/snowflakedeyarakasitashi-nodui-chu-fa)
    その他の活動:
      - name: '[Actice](https://actice.page/)'
        summary: 知人のプロダクトの開発を支援。各マイクロサービスのうちの一つを担当。フロントをReact、バックエンドをLaravelで実装した。

design:
  theme: classic
  typography:
    # cv/fonts/ に置いた Noto Sans JP（make cv で自動取得）
    font_family: Noto Sans JP
  entries:
    # 右カラム（役割・期間）が折り返さない幅
    date_and_location_width: 5.5cm
  templates:
    single_date: YEAR年MONTH_ABBREVIATION
    date_range: START_DATE – END_DATE

locale:
  language: japanese

settings:
  render_command:
    output_folder: rendercv_output
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_png: true
  pdf_title: 向井雄二 - 経歴書
