cv:
  name: 向井雄二
  headline: Data Engineer
  email: ugmuka1@gmail.com
  social_networks:
    - network: X
      username: ugmuka
    - network: LinkedIn
      username: muka1206
  custom_connections:
    - fontawesome_icon: pen-nib
      placeholder: Qiita
      url: https://qiita.com/ugmuka
    - fontawesome_icon: book
      placeholder: Zenn
      url: https://zenn.dev/ugmuka
    - fontawesome_icon: speaker-deck
      placeholder: SpeakerDeck
      url: https://speakerdeck.com/ugmuka
  sections:
    # 構成: サマリー先行（職務要約 → 職務経歴 → 主なプロジェクト）→ 業務外 → Appendix に詳細
    職務要約:
      - >-
        データエンジニアとして 6 年、Snowflake を中心に AWS / GCP 上のデータ分析基盤の構築・移行を 8 件担当。
        dbt・Airflow・Terraform による基盤の IaC 化と CI/CD、複数ベンダー・ステークホルダー間の要件調整を得意とする。
      - >-
        直近 2 年はチームリード・社内 PM として 4〜8 名のチームを率い、1000 億行超・60TB 規模の基盤移行で要件定義からテストまでを統括。
        運用費約 30% 削減の設計や処理速度 20% 改善などの成果を出している。
      - >-
        2026 年からは業務委託で Node.js / AWS CDK による AI エージェント機能の開発にも従事。
        SnowPro Advanced Architect・AWS SA Professional 等 5 資格を保有し、dbt / Snowflake 関連の登壇 4 回。
    職務経歴:
      - company: DATUM STUDIO（株）
        position: データエンジニア / マネージャー
        start_date: 2020-04-01
        end_date: present
        summary: >-
          200人規模の受託企業でマネージャーとして所属。
          データ分析基盤の設計・構築・移行を中心に、以下のプロジェクトを担当。
      - company: AME&Company（株）（業務委託）
        position: バックエンドエンジニア
        start_date: 2026-03
        end_date: present
        summary: >-
          HR テック「HR pentest」（面談音声の議事録自動作成と AI 分析で離職率改善を支援）のバックエンドを担当し、AI エージェント機能を開発。

    # 1 案件 1〜2 行。役割と個人の成果を「論文タイトル」粒度で。詳細は Appendix へ
    主なプロジェクト:
      - name: HR pentest の AI エージェント機能開発（業務委託）
        start_date: 2026-03
        end_date: present
        location: バックエンドエンジニア
        summary: >-
          面談要約からポジティブ / ネガティブを判定し、他部署の面談データを横断サマリして退職要因を分析する AI エージェントを Node.js / AWS CDK で設計・実装。
      - name: 大手小売業界分析基盤の移行刷新
        start_date: 2025-08
        end_date: present
        location: Snowflake基盤担当チームリード / 8名
        summary: >-
          1000億行超・2システム統合の Snowflake 移行で、基盤チーム8名（全体約30名）の要件定義〜テストを統括。
          システム統合により運用費約30%削減を見込む基盤設計を主導。
      - name: 自動車センサーデータ集積基盤の移行刷新
        start_date: 2025-01
        end_date: 2026-03
        location: 社内PM / 5名
        summary: >-
          約60TB・数十億ファイルのオンプレ（NAS / SQL Server）→ AWS・Snowflake 移行を社内PM（全体約20名）として推進。
          Hadoop 10台の並列変換でボトルネックを解消し、処理速度20%改善とインフラコスト削減を実現。
      - name: 決算業務に用いる経理BIの移行刷新
        start_date: 2024-07
        end_date: 2024-12
        location: Snowflake基盤担当チームリード / 4名
        summary: >-
          SAP HANA の EOS に伴う決算BIの Snowflake 移行で、設計・全体コードレビュー・経理部門との要件調整を統括。
      - name: 不動産事業における事業間横断顧客分析基盤の構築
        start_date: 2024-05
        end_date: 2025-03
        location: Snowflake基盤担当チームリード / 4名
        summary: >-
          ホールディングス傘下複数社の SQL Server / MySQL / PostgreSQL / Salesforce を Snowflake に集約し、
          サービス横断の顧客分析基盤を新規構築・リリース。
      - name: ECサイトの全社向け顧客分析基盤の移行刷新
        start_date: 2023-04
        end_date: 2024-12
        location: ETL処理チームリード / 15名
        summary: >-
          Oracle → Snowflake の全社顧客分析基盤移行で ETL 処理チームをリード。
          dbt + Airflow のバッチ基盤を構築し、レガシー基盤からのデータ移行と ETL 開発の効率化を実現。
      - name: テレビ局向け広告配信用基盤構築
        start_date: 2022-08
        end_date: 2023-04
        location: データエンジニア
        summary: >-
          広告配信用の顧客データ基盤を Snowflake + Terraform で設計・構築。
          プロパーとして複数ベンダー間の要件定義・IF 調整を牽引し、レビュー主体で社内の人材育成にも貢献。
      - name: 動画プラットフォームにおける視聴ログ分析基盤の構築
        start_date: 2021-01
        end_date: 2022-07
        location: データエンジニア
        summary: >-
          視聴ログを一括管理する BigQuery 基盤と KPI ダッシュボードを構築。バック・フロントチームと協業してテーブル設計を担当。
      - name: スポーツクラブ向けの顧客分析基盤の構築
        start_date: 2020-04
        end_date: 2020-12
        location: データエンジニア
        summary: >-
          S3 / Glue / Snowflake の顧客分析基盤を構築し、Excel ベースの分析を Tableau ダッシュボードへ移行。
          国内事例の少なかった Snowflake を技術検証から導入して分析を大幅に高速化し、導入事例をユーザー会で発表。
    活かせる経験・知識:
      - label: Language
        details: Python, SQL, PHP, TypeScript
      - label: Cloud / DWH
        details: AWS, GCP, Snowflake
      - label: Data Engineering
        details: dbt(core/cloud), Airflow, Spark, Terraform, GitHub Actions
      - label: BI
        details: Looker, PowerBI, Tableau
      - label: Application
        details: Laravel, React
    業務外の活動:
      - name: 登壇
        highlights:
          - 2023/05 Snowflakeの小技LT「Snowflakeでやらかした時の対処法」 [Slides](https://speakerdeck.com/ugmuka/snowflakedeyarakasitashi-nodui-chu-fa)
          - 2023/01 Data Engineer Geeks「Snowparkを基礎からおさらい」 [Slides](https://speakerdeck.com/ugmuka/snowparkwoji-chu-karaosarai)
          - 2022/12 ちゅらコラボ「1年間dbtで戦った話」 [Slides](https://speakerdeck.com/ugmuka/14-tiyurakorabodeng-tan-zi-liao)
          - 2022/08 dbt Tokyo meetup「rawSQLからdbtへの移行プロセスについて」 [Slides](https://speakerdeck.com/ugmuka/rawsqlkaradbthefalseyi-xing-purosesunituite)
      - name: 技術記事の執筆
        summary: 'データ基盤・Snowflake・dbt を中心に [Qiita](https://qiita.com/ugmuka) 5 件 / [Zenn](https://zenn.dev/ugmuka) 8 件を執筆。'
      - name: 資格
        summary: 応用情報技術者 / AWS Solution Architect Professional / AWS Data Analytics Specialty / GCP Professional Data Engineer / SnowPro Advanced Architect
      - name: 個人開発
        summary: '知人のプロダクト [Actice](https://actice.page/) の開発を支援。マイクロサービスの一つを担当し、フロントを React、バックエンドを Laravel で実装。'

    # 詳細。主なプロジェクトと同じ順（新しい順）
    Appendix 職務経歴詳細:
      - name: HR pentest の AI エージェント機能開発（業務委託）
        start_date: 2026-03
        end_date: present
        location: バックエンドエンジニア
        summary: >-
          AME&Company（株）の HR テック「HR pentest」。面談音声の議事録自動作成と AI による定性データ分析で、人事部門の面談業務効率化と離職率改善を支援するプロダクト。
        highlights:
          - >-
            **担当**:
            バックエンド開発 /
            面談要約のポジティブ・ネガティブ判定 /
            他部署の面談データを横断してサマリし、退職要因を分析する AI エージェントの設計・実装
          - '**技術**: Node.js, React, AWS CDK'
      - name: 大手小売業界分析基盤の移行刷新
        start_date: 2025-08
        end_date: present
        location: Snowflake基盤担当チームリード / 8名
        summary: >-
          大手小売向け分析基盤の移行刷新。並行する2システムのリプレースで、Snowflake 基盤の要件定義から設計・実装・テストを統括。
          チーム8名、プロジェクト全体約30名、ウォーターフォール開発。
        highlights:
          - >-
            **担当**:
            8名のチームリードとして進捗管理・要件調整、他領域リードとの連携 /
            dbt 導入に伴うテーブル定義・変換ロジックの設計レビューと品質管理
          - >-
            **背景**:
            現行基盤の設計書が未更新で、実機ベースの設計検証が必須だった。
            1000億行超のデータ移行のため、移行後検証と並行したパフォーマンス改善が必要だった。
          - >-
            **取り組み**:
            Snowflake + dbt でテーブル設計・管理、SystemWalker（Azure）でバッチ実行と CI/CD を構築。
            現行ベンダーから定期的にコード断面を取得し、差分を抽出・分析。
            Claude Code で既存コードを自動解析し、検証スクリプトを自動化して移行検証を効率化。
            実機検証と並行してパフォーマンス改善策を立案・実施。
          - >-
            **成果**:
            複数システム統合により運用費約30%削減を見込む（未リリース）。
            大規模移行のパフォーマンス問題を早期に検知し、基盤設計を改善。
          - '**技術**: Snowflake, dbt, SystemWalker, Azure, Claude Code'
      - name: 自動車センサーデータ集積基盤の移行刷新
        start_date: 2025-01
        end_date: 2026-03
        location: 社内PM / 5名
        summary: >-
          オンプレの NAS・SQL Server 廃止に伴う車載器センサー分析システムの AWS・Snowflake 移行。
          移行3名 + API 開発2名の計5名で社内PMを務め、全体約20名の複数チーム体制でリード。
        highlights:
          - >-
            **担当**:
            複数ベンダー協業環境での社内PMとして移行チーム・API 開発チームを統括 /
            ウォーターフォールでのスコープ・品質・リスク管理 /
            課題解決策の提案・実行、技術調整と顧客折衝
          - >-
            **背景**:
            約60TBのファイル群の移行でデータ構造を見直し、CSV → JSON 変換が必要となった。数十億ファイルの変換処理がボトルネックで、移行遅延がシステム全体の稼働開始に影響するリスクがあった。
          - >-
            **取り組み**:
            顧客と連携して未使用の Hadoop サーバ10台を調達し、CSV → JSON 変換・圧縮を分散実行する並列処理環境を設計・実装。
            Python で変換・移行処理を自動化。
            Snowflake の特性を活かしたデータ構造の見直しを提案・実行。
            API 開発チームとの IF 仕様調整・検証、進捗報告と課題管理の仕組み導入、運用向けドキュメント整備。
          - >-
            **成果**:
            並列処理で変換ボトルネックを解消し、移行期間を短縮。
            オンプレ廃止でインフラコストを削減し、Snowflake 移行で処理速度20%改善。
            データ構造の見直しにより運用負荷を低減し、保守性を向上。
          - '**技術**: AWS, Snowflake, Python, Hadoop, SQL Server, NAS'
      - name: 決算業務に用いる経理BIの移行刷新
        start_date: 2024-07
        end_date: 2024-12
        location: Snowflake基盤担当チームリード / 4名
        summary: >-
          SAP HANA の EOS に伴い、経理部門が決算業務に利用する BI 基盤を Snowflake へ移行した。
        highlights:
          - >-
            **担当**:
            Snowflake 基盤担当チーム（4名）のリードとして、基盤・データモデルの設計 /
            経理部門および他チームとの要件調整 /
            dbt モデルを含む全体コードレビュー
          - '**技術**: Snowflake, dbt platform, Terraform, SAP HANA'
      - name: 不動産事業における事業間横断顧客分析基盤の構築
        start_date: 2024-05
        end_date: 2025-03
        location: Snowflake基盤担当チームリード / 4名
        summary: >-
          不動産ホールディングス傘下の複数企業からデータを集約し、サービス横断で顧客を分析する基盤を新規構築した。
        highlights:
          - >-
            **担当**:
            Snowflake 基盤担当チーム（4名）の全体リード /
            SQL Server・MySQL・PostgreSQL・Salesforce など多様な連携元からのデータ取り込み設計 /
            複数企業にまたがるステークホルダーとの要件調整
          - >-
            **成果**:
            グループ各社で異なるシステム・データ構造を統合し、サービス横断の顧客分析を可能にする基盤をリリースした。
          - '**技術**: Snowflake, dbt, Airflow, Terraform, SQL Server, MySQL, PostgreSQL, Salesforce'
      - name: ECサイトの全社向け顧客分析基盤の移行刷新
        start_date: 2023-04
        end_date: 2024-12
        location: ETL処理チームリード / 15名
        summary: >-
          ECサイト向けの大規模データ基盤を構築。
          Oracleでの分析基盤からSnowflakeへの移行を行なっている。
        highlights:
          - >-
            **担当**:
            データモデリング検討 /
            新規ダッシュボード要件定義 /
            Airflowによるワークフロー構築 /
            dbtによるデータ変換設計 /
            テスト設計 /
            その他保守運用
          - >-
            **成果**:
            ETL処理チームのプロジェクトリードを担当、レガシー化した旧基盤からのデータ移行に貢献。
            dbt+Airflowによるバッチ処理を構築し、ETL処理の開発効率化を行なっている。
          - '**技術**: Oracle, Snowflake, Airflow, dbt'
      - name: テレビ局向け広告配信用基盤構築
        start_date: 2022-08
        end_date: 2023-04
        location: データエンジニア
        summary: >-
          クライアントの広告配信事業における広告配信用の顧客データ基盤を構築した。
          プロパーとして、前後システムのベンダーと共に要件定義や開発作業の牽引を行った。
        highlights:
          - >-
            **担当**:
            Snowflakeを用いたデータ基盤のインフラ設計、および構築 /
            テーブル設計 /
            上記インフラのTerraformでのIaC化 /
            要件定義全般
          - >-
            **成果**:
            複数ベンダーとの協業であったため、IFなどの要件定義やテスト仕様の調整に注力した。
            開発フェーズにおいてはレビューを主に行い、社内での人材育成に貢献した。
          - '**技術**: Snowflake, Terraform'

design:
  theme: classic
  # 日本企業向け職務経歴書に寄せた設定: A4・白黒・左寄せ・氏名は控えめ・右上に「現在」日付
  page:
    size: a4
    show_footer: true
    show_top_note: true
  colors:
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
  typography:
    # cv/fonts/ に置いた Noto Sans JP（make cv で自動取得）
    font_family: Noto Sans JP
    font_size:
      name: 16pt
      section_titles: 1.2em
  header:
    alignment: left
    space_below_name: 0.3cm
    space_below_headline: 0.3cm
    space_below_connections: 0.5cm
    connections:
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: ' | '
      space_between_connections: 0.2cm
  links:
    underline: true
  section_titles:
    type: with_full_line
  entries:
    # 右カラム（役割・期間）が折り返さない幅
    date_and_location_width: 5.5cm
  templates:
    top_note: YEAR年MONTH月DAY日 現在
    footer: NAME – PAGE_NUMBER/TOTAL_PAGES
    single_date: YEAR年MONTH_ABBREVIATION
    date_range: START_DATE – END_DATE

locale:
  language: japanese

settings:
  render_command:
    output_folder: rendercv_output
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_png: true
  pdf_title: 向井雄二 - 職務経歴書
