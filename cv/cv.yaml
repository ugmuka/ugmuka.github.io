        summary: 知人のプロダクトの開発を支援。各マイクロサービスのうちの一つを担当。フロントをReact、バックエンドをLaravelで実装した。

design:
  theme: classic
  typography:
    # cv/fonts/ に置いた Noto Sans JP（make cv で自動取得）
    font_family: Noto Sans JP
  entries:
    # 右カラム（役割・期間）が折り返さない幅
    date_and_location_width: 5.5cm
  templates:
    single_date: YEAR年MONTH_ABBREVIATION
    date_range: START_DATE – END_DATE

locale:
