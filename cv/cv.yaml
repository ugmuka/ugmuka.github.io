cv:
  name: 向井雄二
  headline: Data Engineer
  email: ugmuka1@gmail.com
  social_networks:
    - network: X
      username: ugmuka
    - network: LinkedIn
      username: muka1206
  custom_connections:
    - fontawesome_icon: pen-nib
      placeholder: Qiita
      url: https://qiita.com/ugmuka
    - fontawesome_icon: book
      placeholder: Zenn
      url: https://zenn.dev/ugmuka
    - fontawesome_icon: speaker-deck
      placeholder: SpeakerDeck
      url: https://speakerdeck.com/ugmuka
  sections:
    職務経歴:
      - company: DATUM STUDIO（株）
        position: データエンジニア
        start_date: 2020-04-01
        end_date: present
        summary: データ分析基盤の設計・構築・移行を中心に、以下のプロジェクトを担当。

    # 新しい順に並べる
    プロジェクト:
      - name: 大手小売業界分析基盤の移行刷新
        start_date: 2025-08
        end_date: present
        location: 役割：Snowflake基盤担当チームリード / チーム8名
        summary: >-
          並列して2システムのリプレースを行いました。
          大手小売業界向けの分析基盤移行刷新プロジェクトにおいて、 Snowflake基盤の要件定義から設計、コーディング、テストを統括しました。
          エンジニア8名のSnowflake基盤担当チームをリードし、 プロジェクト全体では他領域を含む合計約30名規模のチームで構成されていました。
          チームはウォーターフォール開発手法に則り、各フェーズを厳格に管理しながら開発を進めました。
        highlights:
          - >-
            **担当**:
            エンジニア8名のチームリードを担当し、進捗管理と要件調整行い、他領域のリードと密に連携しました。
            dbt導入に伴うテーブル定義の設計レビューや品質管理を実施し、コードの品質向上とパフォーマンス最適化に注力しました。
          - >-
            **背景**:
            現行の分析基盤の設計書が最新状態に更新されておらず、実機ベースの設計検証が必須となっていました。
            データ量が1000億行以上に及ぶ大規模なデータ移行を実施するため、移行後の検証と並行してパフォーマンス改善策の検討が必要でした。
            移行刷新による投資効果の最大化を図るため、運用コスト削減とシステムの安定稼働確保が重要な課題でした。
          - >-
            **取り組み**:
            Snowflakeをデータウェアハウスとして採用し、dbtを用いたテーブル設計・管理を実施しました。
            バッチ実行にSystemWalker（Azure上ホスト）を活用し、CICDを構築しました。
            開発プロセスはウォーターフォールで進行し、設計、実装、テストの各フェーズでレビューを重ねて品質を担保しました。
            dbt導入に伴うテーブル定義や変換ロジックの設計全般をレビューし、パフォーマンス最適化と保守性向上を推進しました。
            現行システムの仕様変更に追随するため、現行開発ベンダーから定期的にコード断面を提供いただき、差分を抽出・分析しました。
            Claude Codeを活用して既存コードの自動解析を行い、検証用スクリプトの自動化により移行検証の効率化を図りました。
            移行後のパフォーマンス問題を早期に発見するため、実機上での検証作業と並行して改善施策を立案・実施しました。
            複数システムの統合による運用費削減を目指し、基盤の合理化と自動化を推進しました。
            プロジェクト全体の進捗と課題を可視化するため、定期的なレビューとリスク管理を徹底しました。
          - >-
            **成果**:
            複数システム統合による運用費の約30%削減を見込み、コスト効率の大幅な改善に寄与しました（未リリース）。
            大規模データ移行におけるパフォーマンス問題を早期に検知し、安定稼働に向けた基盤設計の改善を実現しました。
            ウォーターフォール開発手法に基づく厳密な工程管理により、プロジェクトの進捗管理と品質確保を両立しました。
          - '**技術**: Snowflake, dbt, SystemWalker, Azure, Claude Code'
      - name: 自動車センサーデータ集積基盤の移行刷新
        start_date: 2025-01
        end_date: 2026-03
        location: 役割：プロジェクトマネージャー（社内PM） / チーム5名
        summary: >-
          オンプレミスのNASおよびSQL Server廃止に伴う車載器センサー分析システムの AWSとSnowflakeへのクラウド移行を推進しました。
          移行チーム3名およびAPI開発2名、計5名の小規模チームの中で社内PMを務め、 全体で約20名規模の複数チームが協働する体制内でリードとしての役割を果たしました。
        highlights:
          - >-
            **担当**:
            プロジェクトマネージャーとして、複数ベンダーが協業する環境下で社内でのPMを担当し、移行チームおよびAPI開発チームのとりまとめを実施しました。
            ウォーターフォール開発手法に基づき、スコープ管理、品質管理、リスク管理を主導し、プロジェクトの円滑な推進を支援しました。
            移行プロセスにおける課題解決策の提案・実行に携わり、技術的な調整および顧客折衝を行いました。
          - >-
            **背景**:
            約60TBに及ぶファイル群をクラウドへ移行する際、データ構造の見直しに伴いCSVファイルをJSON形式に変換しなければならず、数十億ファイル規模の変換処理がパフォーマンス上の大きなボトルネックとなっていました。
            移行作業の遅延がシステム全体の稼働開始に影響を及ぼすリスクがあり、効率的かつ確実な移行方法の確立が求められました。
          - >-
            **取り組み**:
            AWSおよびSnowflakeを利用し、基盤のクラウド化を推進しました。
            Pythonを用いてデータ変換および移行処理の一部を自動化し、効率化を図りました。
            ウォーターフォール開発手法により、計画的な進捗管理と品質管理を徹底しました。
            顧客と密に連携し、未使用のHadoopサーバ10台を調達して並列処理環境を構築し、CSVからJSONへの変換および圧縮処理を分散実行する仕組みを設計・実装しました。
            並列処理による変換処理の高速化により、ファイル変換のボトルネックを大幅に解消し、移行期間の短縮に寄与しました。
            移行に伴いデータ構造の見直しを実施し、Snowflakeの特性を活かした効率的なデータ設計を提案・実行しました。
            API開発チームとの連携を強化し、移行後のシステム連携に必要なインターフェース仕様の調整と検証を行いました。
            移行作業のリスクを低減するため、詳細な進捗報告と課題管理の仕組みを導入し、ステークホルダー間の透明性を確保しました。
            運用・保守フェーズに向けたドキュメント整備とナレッジ共有を推進し、移行後の安定稼働を支援しました。
          - >-
            **成果**:
            オンプレミスサーバの廃止によりインフラコストの削減に寄与しました。
            Snowflakeへの移行に伴い処理速度が20%改善されました。
            データ構造の見直しとクラウド基盤の活用により、運用負荷が低減し、保守性の向上に寄与しました。
          - '**技術**: AWS, Snowflake, Python, Hadoop, SQL Server, NAS'
      - name: 決算業務に用いる経理BIの移行刷新
        start_date: 2024-07
        end_date: 2024-12
        location: 役割：Snowflake基盤担当チームリード / チーム4名
      - name: 不動産事業における事業間横断顧客分析基盤の構築
        start_date: 2024-05
        end_date: 2025-03
        location: 役割：Snowflake基盤担当チームリード / チーム4名
      - name: ECサイトの全社向け顧客分析基盤の移行刷新
        start_date: 2023-04
        end_date: 2024-12
        location: 役割：Snowflake基盤担当チームリード / チーム85名
        summary: >-
          ECサイト向けの大規模データ基盤を構築。
          Oracleでの分析基盤からSnowflakeへの移行を行なっている。
        highlights:
          - >-
            **担当**:
            データモデリング検討 /
            新規ダッシュボード要件定義 /
            Airflowによるワークフロー構築 /
            dbtによるデータ変換設計 /
            テスト設計 /
            その他保守運用
          - >-
            **成果**:
            ETL処理チームのプロジェクトリードを担当、レガシー化した旧基盤からのデータ移行に貢献。
            dbt+Airflowによるバッチ処理を構築し、ETL処理の開発効率化を行なっている。
          - '**技術**: Oracle, Snowflake, Airflow, dbt'
      - name: テレビ局向け広告配信用基盤構築
        start_date: 2022-08
        end_date: 2023-04
        location: 役割：データエンジニア
        summary: >-
          クライアントの広告配信事業における広告配信用の顧客データ基盤を構築した。
          プロパーとして、前後システムのベンダーと共に要件定義や開発作業の牽引を行った。
        highlights:
          - >-
            **担当**:
            Snowflakeを用いたデータ基盤のインフラ設計、および構築 /
            テーブル設計 /
            上記インフラのTerraformでのIaC化 /
            要件定義全般
          - >-
            **成果**:
            複数ベンダーとの協業であったため、IFなどの要件定義やテスト仕様の調整に注力した。
            開発フェーズにおいてはレビューを主に行い、社内での人材育成に貢献した。
          - '**技術**: Snowflake, Terraform'
      - name: 動画プラットフォームにおける視聴ログ分析基盤の構築
        start_date: 2021-01
        end_date: 2022-07
        location: 役割：データエンジニア
        summary: >-
          動画プラットフォームにおいて、視聴ログなどを一括管理するデータ分析基盤の構築を支援。
          また、視聴ログ分析から動画の改善を提案するため、KPIダッシュボードを構築した。
        highlights:
          - >-
            **担当**:
            SFTPサーバー上でのデータレイク構築 /
            Python /
            BigQueryを用いたDWH構築(テーブル設計, 運用, SQLでのETL構築) /
            データマート設計
          - >-
            **成果**:
            バック、フロントチームと協業しながら要件を満たすテーブル設計を行う。
          - '**技術**: SFTP, Python, BigQuery'
      - name: スポーツクラブ向けの顧客分析基盤の構築
        start_date: 2020-04
        end_date: 2020-12
        location: 役割：データエンジニア
        summary: >-
          スポーツクラブ向けの顧客データ分析基盤を構築した。
          エクセルベースでの分析からTableauでの分析、定常KPIを表示するダッシュボードへと移行。
        highlights:
          - >-
            **担当**:
            AWS S3上でのデータレイク構築 /
            AWS Glue(Spark)を用いた大規模データの分散処理 /
            Snowflakeを用いたDWH構築(テーブル設計, 運用, SQLでのETL構築) /
            上記インフラのTerraformでのIaC化 /
            GitHub ActionsでのCI/CDの構築 /
            Tableauで表示するためのデータマート設計
          - >-
            **成果**:
            日本でまだ導入事例が少ないDWHであるSnowflakeについて技術検証、導入を行い、分析基盤の大幅な高速化に貢献。
            導入事例をユーザー会で紹介する等、外部への発信も積極的に行った。
          - '**技術**: AWS S3, AWS Glue, Spark, Snowflake, Terraform, GitHub Actions, Tableau'
    スキル:
